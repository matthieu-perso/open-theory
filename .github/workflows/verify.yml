name: Lean 4 Proof Verification & Blueprint Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-kernel:
    name: Lean kernel, axioms, and blueprint names
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      - name: Lake build
        run: lake build

      - name: Axiom audit
        run: lake env lean --run scripts/audit_axioms.lean

      - name: Check blueprint Lean names
        run: python3 scripts/check_lean_decls.py

      - name: Export blueprint.json
        run: python3 scripts/export_blueprint.py blueprint/blueprint.json

      - name: Fail if committed graph is stale
        run: |
          python3 scripts/export_blueprint.py /tmp/blueprint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              data = json.loads(Path(path).read_text())
              data.pop("generatedAt", None)
              return data

          committed = load("blueprint/blueprint.json")
          generated = load("/tmp/blueprint.json")
          if committed != generated:
              raise SystemExit(
                  "blueprint/blueprint.json is stale. Run:\n"
                  "  python3 scripts/export_blueprint.py blueprint/blueprint.json"
              )
          print("[OK] blueprint.json matches content.tex")
          PY

      - name: Upload blueprint graph
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-data
          path: blueprint/blueprint.json
          retention-days: 14
