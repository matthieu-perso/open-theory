name: Lean 4 Proof Verification & Blueprint Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-kernel:
    name: Lean kernel, axioms, and blueprint names
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      - name: Lake build
        run: lake build

      - name: Axiom audit
        run: lake env lean --run scripts/audit_axioms.lean

      - name: Check blueprint Lean names
        run: python3 scripts/check_lean_decls.py

      - name: Fail if committed graph is stale
        run: python3 scripts/export_blueprint.py --check

      - name: Regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          lake build audit_axioms
          lake env lean tests/AuditRegression.lean
          lake env lean tests/FoundationSmoke.lean
          lake env lean tests/RidgeSmoke.lean
          lake env lean tests/ArchitectureSmoke.lean
          lake env lean tests/OptimizerSmoke.lean
          lake env lean tests/AttentionSmoke.lean
          lake env lean tests/TransformerSmoke.lean
          lake env lean tests/PopulationBoundsSmoke.lean
          lake env lean tests/StatisticalBridgeSmoke.lean
          lake env lean tests/FiniteClassSmoke.lean
          lake env lean tests/CoveringSmoke.lean
          lake env lean tests/TrainedRidgeSmoke.lean
          lake env lean tests/RidgeRiskSmoke.lean
          lake env lean tests/KernelRidgeSmoke.lean
          lake env lean tests/FeatureStepSmoke.lean
          lake env lean tests/TangentStepSmoke.lean
          lake env lean tests/MLPTrajectorySmoke.lean
          lake env lean tests/MLPComparisonSmoke.lean
          lake env lean tests/MLPEndpointSmoke.lean
          lake env lean tests/MLPFixedDesignSmoke.lean
          lake env lean tests/MLPBatchBoundsSmoke.lean
          lake env lean tests/MLPRiskSmoke.lean

      - name: Upload blueprint graph
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-data
          path: blueprint/blueprint.json
          retention-days: 14
